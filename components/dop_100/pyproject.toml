[build-system]
requires = ["setuptools>=77"]
build-backend = "setuptools.build_meta"

[project]
name = "universal-diascreen-hmi-agent"
version = "0.4.4"
description = "Original file-only DIAScreen/DOP-100 inspection and controlled offline editing"
readme = "README.md"
requires-python = ">=3.11"
license = "Apache-2.0"
license-files = ["LICENSE", "NOTICE.md"]
authors = [{name = "Universal DIAScreen HMI Agent contributors"}]
dependencies = []
classifiers = [
  "Development Status :: 3 - Alpha",
  "Environment :: Console",
  "Operating System :: OS Independent",
  "Programming Language :: Python :: 3",
  "Programming Language :: Python :: 3.11",
  "Programming Language :: Python :: 3.12",
  "Programming Language :: Python :: 3.13",
  "Programming Language :: Python :: 3.14",
]

[project.scripts]
universal-diascreen-hmi-agent = "universal_diascreen_hmi.cli:main"

[tool.setuptools]
package-dir = {"" = "src"}
include-package-data = false

[tool.setuptools.packages.find]
where = ["src"]
include = ["universal_diascreen_hmi*"]
exclude = ["tests*", "private*"]

# Public reference assets also enter sdist; no proprietary/native fixtures.
[tool.setuptools.data-files]
"share/universal-diascreen-hmi-agent" = ["AGENTS.md", "SYSTEM_PROMPT.md", "INDEX.md", "INTEGRATION.json", "SOURCE_MANIFEST.json"]
"share/universal-diascreen-hmi-agent/docs" = ["docs/*.md", "docs/*.json"]
"share/universal-diascreen-hmi-agent/profiles" = ["profiles/*.json"]
"share/universal-diascreen-hmi-agent/examples" = ["examples/*.py"]
"share/universal-diascreen-hmi-agent/tools" = ["tools/*.py"]
"share/universal-diascreen-hmi-agent/tests" = ["tests/*.py"]

[project.optional-dependencies]
visuals = ["Pillow==12.2.0"]

[tool.setuptools.package-data]
"universal_diascreen_hmi.extended" = ["RELEASE_MANIFEST.json"]
